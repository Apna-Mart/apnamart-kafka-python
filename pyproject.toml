[project]
name = "apnamart-kafka-python"
version = "2.0.0"
description = "The easiest way to use Apache Kafka in Python - production-ready client built on confluent-kafka"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "confluent-kafka>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apnamart_kafka"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--cov=apnamart_kafka",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=90",
    "-v",
    "--tb=short",
    "--strict-markers"
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (requires Kafka)",
    "benchmark: Performance benchmark tests",
    "stress: Stress tests (high load)",
    "slow: Slow running tests"
]
filterwarnings = [
    "ignore::DeprecationWarning:confluent_kafka.*",
    "ignore::pytest.PytestUnraisableExceptionWarning"
]
timeout = 300
testmon_off = true

[dependency-groups]
dev = [
    "faker>=35.2.2",
    "mypy>=1.14.1",
    "psutil>=7.1.0",
    "pytest>=8.3.5",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.2",
]
