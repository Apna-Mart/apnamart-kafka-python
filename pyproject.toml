[project]
name = "apnamart-kafka-python"
version = "2.0.0"
description = "Minimal Kafka client boilerplate for Python applications built on confluent-kafka"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "confluent-kafka>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apnamart_kafka"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=apnamart_kafka --cov-report=term-missing"

[dependency-groups]
dev = [
    "faker>=35.2.2",
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "ruff>=0.12.2",
]
